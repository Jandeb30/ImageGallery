<title>Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* Design plan — Gallery
   * Color: warm ivory background, deep charcoal ink, champagne gold accent,
   * soft taupe borders, white surfaces.
   * Type: Cormorant Garamond display, Inter body.
   * Layout: centered grid of identically sized image containers.
   */
  :root {
    --bg: #FAF8F5;
    --fg: #252422;
    --muted: #6E675E;
    --accent: #B89B6D;
    --border: #E7E2D8;
    --surface: #FFFFFF;
    --shadow: 0 20px 40px -10px rgba(37, 36, 34, 0.06);
    --radius: 2px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141210;
      --fg: #EAE7E2;
      --muted: #9E9489;
      --accent: #C9B283;
      --border: #2C2825;
      --surface: #1C1917;
      --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141210;
    --fg: #EAE7E2;
    --muted: #9E9489;
    --accent: #C9B283;
    --border: #2C2825;
    --surface: #1C1917;
    --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 40px;
    -webkit-font-smoothing: antialiased;
  }

  .wrapper { max-width: 900px; margin: 0 auto; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; gap: 16px; } }

  .image-container {
    aspect-ratio: 4 / 5;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.25, 1), box-shadow 0.4s cubic-bezier(0.25, 1, 0.25, 1), border-color 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .image-container:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: var(--accent);
  }
  .image-container:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .image-wrap { width: 100%; height: 100%; position: relative; }
  .image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.92; transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.25, 1, 0.25, 1); }
  .image-container:hover img { opacity: 1; transform: scale(1.03); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* Scroll-triggered modal */
  .scroll-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(37, 36, 34, 0.55);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
    padding: 24px;
  }
  .scroll-modal-overlay.show {
    opacity: 1;
    visibility: visible;
  }
  .scroll-modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.25);
    max-width: 480px;
    width: 100%;
    padding: 48px 32px 32px;
    position: relative;
    transform: translateY(20px);
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.25, 1);
  }
  .scroll-modal-overlay.show .scroll-modal {
    transform: translateY(0);
  }
  .scroll-modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: transparent;
    border: none;
    width: 32px;
    height: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    border-radius: 50%;
    transition: background 0.2s ease, color 0.2s ease;
    font-size: 24px;
    line-height: 1;
  }
  .scroll-modal-close:hover {
    background: var(--border);
    color: var(--fg);
  }
  .scroll-modal-close:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .scroll-modal h2 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 2rem;
    font-weight: 500;
    margin: 0 0 16px;
    color: var(--fg);
    line-height: 1.2;
  }
  .scroll-modal p {
    color: var(--muted);
    margin: 0 0 24px;
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    .scroll-modal-overlay,
    .scroll-modal {
      transition: none;
    }
  }
</style>
</head>
<body>

  <div class="scroll-modal-overlay" id="scrollModal" role="dialog" aria-modal="true" aria-labelledby="scrollModalTitle" aria-hidden="true">
    <div class="scroll-modal">
      <button class="scroll-modal-close" type="button" aria-label="Close dialog">&times;</button>
      <h2 id="scrollModalTitle">If you reached this far, listen.</h2>
      <p>Every piece in this gallery is available for private viewing. Get the full catalogue and a curated selection delivered to you.</p>
    </div>
  </div>

  <script>
    (function () {
      var modal = document.getElementById('scrollModal');
      var closeBtn = modal.querySelector('.scroll-modal-close');
      var shown = false; // only trigger once
      var lastFocused = null;

      // Trigger point: scroll this fraction of the way down the page
      var TRIGGER_AT = 0.35;

      function openModal() {
        if (shown) return;
        shown = true;
        lastFocused = document.activeElement;
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
        closeBtn.focus();
        document.body.style.overflow = 'hidden'; // lock background scroll
        window.removeEventListener('scroll', onScroll);
      }

      function closeModal() {
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
      }

      function onScroll() {
        var scrollTop = window.scrollY || document.documentElement.scrollTop;
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        if (docHeight > 0 && scrollTop / docHeight >= TRIGGER_AT) {
          openModal();
        }
      }

      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeModal(); // click backdrop to close
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
      });

      window.addEventListener('scroll', onScroll, { passive: true });
    })();
  </script>
