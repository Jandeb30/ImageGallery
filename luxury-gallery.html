<title>Gallery</title>

<style>
  /* Design plan — Gallery
   * Color: warm ivory background, deep charcoal ink, champagne gold accent,
   * soft taupe borders, white surfaces.
   * Type: Cormorant Garamond display, Inter body.
   * Layout: centered grid of identically sized image containers.
   */
  :root {
    --bg: #FAF8F5;
    --fg: #252422;
    --muted: #6E675E;
    --accent: #B89B6D;
    --border: #E7E2D8;
    --surface: #FFFFFF;
    --shadow: 0 20px 40px -10px rgba(37, 36, 34, 0.06);
    --radius: 2px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141210;
      --fg: #EAE7E2;
      --muted: #9E9489;
      --accent: #C9B283;
      --border: #2C2825;
      --surface: #1C1917;
      --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141210;
    --fg: #EAE7E2;
    --muted: #9E9489;
    --accent: #C9B283;
    --border: #2C2825;
    --surface: #1C1917;
    --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 40px;
    -webkit-font-smoothing: antialiased;
  }

  .wrapper { max-width: 900px; margin: 0 auto; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; gap: 16px; } }

  .image-container {
    aspect-ratio: 4 / 5;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.25, 1), box-shadow 0.4s cubic-bezier(0.25, 1, 0.25, 1), border-color 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .image-container:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: var(--accent);
  }
  .image-container:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .image-wrap { width: 100%; height: 100%; position: relative; }
  .image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.92; transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.25, 1, 0.25, 1); }
  .image-container:hover img { opacity: 1; transform: scale(1.03); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
